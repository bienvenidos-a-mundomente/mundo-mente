<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5929AD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mundo Mente">
<meta name="description" content="Juego para aprender emociones, amistades, conflictos y calma. De 4 a 18 años.">
<title>Mundo Mente</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}html,body{margin:0}</style>
</head>
<body>
<style>
/* Concepto: red social de pantalla completa. Un post = una tarea. El color de cada post lo da su categoría; el acento lo da el interés de cada niño o niña. */
:root{
  --h:262; --ch:262; --fs:1;
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#17203D; --muted:#566080; --line:#D3D9EE;
  --accent:hsl(var(--h) 62% 42%); --on-accent:#FFFFFF; --accent-soft:hsl(var(--h) 75% 92%);
  --good:#146C43; --good-soft:#D9F2E3; --try:#774900; --try-soft:#FFEFC7;
  --tint:9%; --shadow:0 6px 18px rgba(23,32,61,.10);
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Lexend',system-ui,'Segoe UI',sans-serif;
  font-size:calc(16px * var(--fs));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1226; --surface:#182041; --ink:#EEF1FF; --muted:#A9B2D6; --line:#2C3764;
  --accent:hsl(var(--h) 85% 72%); --on-accent:#0D1226; --accent-soft:hsl(var(--h) 38% 22%);
  --good:#7BE3AB; --good-soft:#12382A; --try:#FFD580; --try-soft:#3B2F10;
  --tint:15%; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1226; --surface:#182041; --ink:#EEF1FF; --muted:#A9B2D6; --line:#2C3764;
  --accent:hsl(var(--h) 85% 72%); --on-accent:#0D1226; --accent-soft:hsl(var(--h) 38% 22%);
  --good:#7BE3AB; --good-soft:#12382A; --try:#FFD580; --try-soft:#3B2F10;
  --tint:15%; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark;}
:root.calm{--tint:4%}
:root.hc{--line:var(--ink); --muted:var(--ink); --tint:0%}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{height:100%;max-width:540px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.shell{height:100%;display:flex;flex-direction:column}
.ob{height:100%;overflow-y:auto;padding:24px 16px 32px}

/* barra superior */
.top{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.brand{font:800 1.35rem/1 var(--f-display);color:var(--accent);display:none}
.sp{flex:1}
@media(min-width:440px){.brand{display:block}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.3rem;flex:none;padding:0}
.ava{background:var(--accent-soft);border-color:var(--accent)}
.chans{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chans::-webkit-scrollbar{display:none}
.chan{flex:none;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap;min-height:40px}
.chan[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* feed */
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.post .pmain{transition:opacity .35s ease,transform .35s ease}
.post:not(.seen) .pmain{opacity:.45;transform:translateY(16px)}
:root.calm .post:not(.seen) .pmain{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.post .pmain{transition:none}.post:not(.seen) .pmain{opacity:1;transform:none}}
.feed.locked{overflow-y:hidden}
@media(prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}}
.post{min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px;position:relative;
  background:var(--bg);background:color-mix(in srgb,hsl(var(--ch) 85% 52%) var(--tint),var(--bg));border-top:1px solid var(--line)}
.pmain{display:flex;flex-direction:column;gap:12px;padding-right:62px;min-width:0}
.phead{display:flex;align-items:center;gap:10px;min-width:0;padding-right:62px}
.pav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;flex:none;background:hsl(var(--ch) 80% 90%);border:2px solid hsl(var(--ch) 55% 45%)}
:root[data-theme="dark"] .pav{background:hsl(var(--ch) 35% 24%);border-color:hsl(var(--ch) 60% 65%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pav{background:hsl(var(--ch) 35% 24%);border-color:hsl(var(--ch) 60% 65%)}}
.pname{min-width:0}
.pname b{display:block;font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.pname small{color:var(--muted);font-size:.8rem}
.badge{margin-left:auto;flex:none;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line);white-space:nowrap}
.steps{display:none;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
:root.steps-on .steps{display:flex}
.steps span{padding:3px 10px;border-radius:999px;border:1px dashed var(--muted)}
.steps span.on{background:var(--ink);color:var(--bg);border-style:solid}
.scene{display:grid;place-items:center;min-height:116px;border-radius:24px;background:var(--surface);border:2px solid var(--line);font-size:3rem;letter-spacing:.12em;padding:14px;text-align:center;overflow-wrap:anywhere;line-height:1.25}
.story{font-size:1.2rem;line-height:1.55}
.q{font:700 1.45rem/1.25 var(--f-display);text-wrap:balance}
.banner{border-radius:16px;padding:10px 14px;font-size:.92rem;background:var(--accent-soft);border:2px solid var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:1.05rem;line-height:1.35}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:600;background:var(--accent-soft);color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--try);background:var(--try-soft);opacity:.75}
.opt.dim{opacity:.55}
.opt.alt{border-style:dashed;background:transparent}
.opt:disabled{cursor:default}
.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft);border:2px solid var(--good)}
.fb.try{background:var(--try-soft);border:2px solid var(--try)}
.fb strong{font:700 1.15rem var(--f-display)}
.pts{align-self:flex-start;font-weight:600;font-size:.9rem;padding:2px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.adult{border-radius:16px;padding:12px 14px;font-size:.95rem;border:2px dashed var(--muted);background:var(--surface)}
.adult b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:6px}
.btn{min-height:50px;padding:10px 22px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);text-decoration:underline}
.btn:disabled{opacity:.45;cursor:default}
.rail{position:absolute;right:8px;top:70px;display:flex;flex-direction:column;gap:12px;align-items:center}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;font-size:.7rem;color:var(--muted);text-decoration:none;width:50px}
.rbtn i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-size:1.25rem;box-shadow:var(--shadow)}
.rbtn[aria-pressed="true"] i{background:var(--accent-soft);border-color:var(--accent)}

/* interacciones */
.bubble-wrap{display:grid;place-items:center;min-height:230px}
.bubble{width:150px;height:150px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 16px var(--accent-soft);transform:scale(.62);transition:transform 4s ease-in-out}
.bubble.in{transform:scale(1)}
.bubble.out{transform:scale(.62);transition-duration:6s}
.cue{text-align:center;font:700 1.3rem var(--f-display);min-height:2em}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:.7rem;color:var(--muted);min-height:76px}
.face i{font-style:normal;font-size:1.8rem}
.face[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.srow .lbl{width:100px;font-weight:500}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.1rem}
.dot[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good)}
.mine{margin:0;padding:10px 14px 10px 36px;border-radius:16px;border:2px dashed var(--line);min-height:48px;display:flex;flex-direction:column;gap:4px}
.mine:empty::before{content:"Aquí aparecerá tu orden";color:var(--muted);margin-left:-22px;list-style:none}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.bigstep{font:600 1.3rem/1.4 var(--f-display);text-align:center;padding:18px;border-radius:20px;background:var(--surface);border:2px solid var(--line);min-height:110px;display:grid;place-items:center}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);min-height:56px}
.chk .bx{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.9rem}
.chk[aria-checked="true"]{border-color:var(--good);background:var(--good-soft)}
.chk[aria-checked="true"] .bx{background:var(--good);color:var(--surface);border-color:var(--good)}
.phr{display:flex;gap:8px}
.phr .opt{flex:1}
.phr .hear{flex:none;width:52px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:1.2rem}

.prev{font-size:.82rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.prev span{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.rprog{display:flex;align-items:center;gap:10px;padding:0 16px 8px;font-size:.82rem;color:var(--muted)}
.rprog .bar{flex:1;height:10px}
.rprog b{color:var(--ink);font-weight:600;white-space:nowrap}
.chan.quick{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.count{text-align:center;font:800 2.2rem var(--f-display);min-height:1.3em;font-variant-numeric:tabular-nums}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats span{padding:4px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-size:.9rem}
.srow.col{flex-direction:column;align-items:flex-start;gap:6px}
.nr .pmain{padding-right:0}
.dots7{display:flex;gap:6px}
.d7{flex:1;text-align:center;font-size:.72rem;color:var(--muted)}
.d7 i{width:100%;max-width:38px;aspect-ratio:1;margin:0 auto 2px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-style:normal;display:grid;place-items:center;color:var(--ink)}
.d7.on i{background:var(--good-soft);border-color:var(--good)}
@media(max-width:380px){.rail{right:2px}.rbtn{width:44px;font-size:0}.rbtn i{width:42px;height:42px}.pmain,.phead{padding-right:50px}.nr .pmain{padding-right:0}}
/* vistas */
.view{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 28px;display:flex;flex-direction:column;gap:16px}
.view h2{font:800 1.5rem/1.2 var(--f-display)}
.view h3{font:700 1.15rem/1.25 var(--f-display)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted);font-size:.92rem}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.hero{display:flex;align-items:center;gap:14px}
.hero .big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;background:var(--accent-soft);border:3px solid var(--accent);flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ach{border-radius:16px;border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:var(--surface)}
.ach.lock{opacity:.5}
.ach.lock i{filter:grayscale(1)}
.ach i{font-style:normal;font-size:1.8rem}
.ach b{font-size:.92rem;line-height:1.25}
.ach small{color:var(--muted);font-size:.78rem;line-height:1.3}
.stk{aspect-ratio:1;border-radius:18px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface);font-size:2.2rem;padding:6px;text-align:center}
.stk small{font-size:.72rem;color:var(--muted)}
.stk.lock{opacity:.5}
.stk.lock span{filter:grayscale(1) brightness(.8)}
.rw{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rw:first-of-type{border-top:0}
.rw .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.rw .row b{min-width:0;overflow-wrap:anywhere}
.sw{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:2px solid var(--line);border-radius:16px;background:var(--surface);min-height:58px}
.sw .t{min-width:0}
.sw .t small{display:block;color:var(--muted);font-size:.82rem;line-height:1.3}
.sw .tg{margin-left:auto;flex:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw .tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.sw[aria-checked="true"] .tg{background:var(--accent)}
.sw[aria-checked="true"] .tg::after{transform:translateX(20px)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.four{grid-template-columns:1fr 1fr}
.segb{padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:left;min-height:62px;line-height:1.3}
.segb small{display:block;color:var(--muted);font-size:.78rem}
.segb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field{width:100%;min-height:48px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg)}
.pre{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.pre small{color:var(--muted);font-size:.8rem;line-height:1.3}
.pre[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.sbar{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:.88rem}
@media(max-width:400px){.sbar{grid-template-columns:100px 1fr 38px}}

/* navegación */
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--line);background:var(--surface)}
.nav button{border:0;background:none;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.74rem;color:var(--muted);min-height:58px;justify-content:center}
.nav button span{font-size:1.4rem;line-height:1.2}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
:root.hc .nav button{color:var(--ink)}

/* hojas y ventanas */
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,30,.6);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.sheet-bg.mid{align-items:center;padding:16px}
.sheet{width:min(540px,100%);max-height:90%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.mid .sheet{border-radius:28px;text-align:center;align-items:center;padding:26px 20px;gap:10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font:800 1.35rem var(--f-display)}
.emo{font-size:4.2rem;line-height:1.1}
.chest{font-size:5rem;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.float{position:fixed;z-index:70;font:700 1.3rem var(--f-display);pointer-events:none;color:var(--ink);background:var(--surface);padding:2px 12px;border-radius:99px;border:2px solid var(--accent);animation:rise 1.1s ease-out forwards}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.conf{position:fixed;z-index:70;pointer-events:none;font-size:1.4rem;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(240deg);opacity:0}}
:root.calm .conf,:root.calm .chest{animation:none}
@media(prefers-reduced-motion:reduce){.conf,.chest,.bubble,.float{animation:none}.bubble{transition:none}}
.int-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.avs{display:flex;gap:10px;flex-wrap:wrap}
.avs button{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-size:2rem;padding:0}
.avs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ages{display:flex;flex-wrap:wrap;gap:8px}
.ages button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600}
.ages button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.obbig{font:800 2.2rem/1.1 var(--f-display);color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
</style>

<div id="app">
  <div id="ob" class="ob" hidden></div>
  <div id="shell" class="shell" hidden>
    <header class="top">
      <button id="avaBtn" class="iconbtn ava" aria-label="Mi perfil"></button>
      <span class="brand">Mundo Mente</span>
      <span class="sp"></span>
      <span class="chip" id="hudPts" aria-label="Puntos"></span>
      <span class="chip" id="hudStreak" aria-label="Días seguidos"></span>
      <button id="setBtn" class="iconbtn" aria-label="Cómo me gusta jugar">⚙️</button>
    </header>
    <nav id="chans" class="chans" aria-label="Canales"></nav>
    <div id="rprog" class="rprog" aria-live="polite"></div>
    <main id="feed" class="feed" tabindex="-1"></main>

}

{id:'m1',t:'mind',lv:[0,1],k:'choice',scene:'{a} 🧸 📦🔴 📦🔵',story:'{A} guarda su osito en la caja roja y sale a jugar. Mientras {A} no está, {B} cambia el osito a la caja azul.',q:'Cuando {A} vuelva, ¿dónde va a buscar su osito?',o:['En la caja roja 🔴','En la caja azul 🔵'],ok:0,hint:'¿{A} vio que {B} lo cambió?',why:'{A} no vio el cambio, así que busca donde cree que está. Las personas actúan según lo que creen, aunque no sea verdad.'},
{id:'m2',t:'mind',lv:[0,1],k:'choice',scene:'📦 “Lápices” ✏️ ➜ 🧸',story:'Esta caja dice “Lápices”, pero adentro hay un osito. {A} llega y todavía no abre la caja.',q:'¿Qué cree {A} que hay adentro?',o:['Lápices ✏️','Un osito 🧸'],ok:0,hint:'{A} solo ve la caja por fuera.',why:'{A} todavía no miró adentro, así que cree lo que dice la caja. Tú sabes la verdad y {A} no. ¡Saber cosas distintas es normal!'},
{id:'m3',t:'mind',lv:[0,1],k:'choice',scene:'{a} 🍫   {b} 🍓',story:'A {A} le encanta el helado de chocolate. A {B} le encanta el de frutilla. Hoy {A} va a regalarle un helado a {B}.',q:'¿Cuál debería elegir {A}?',o:['Chocolate 🍫','Frutilla 🍓'],ok:1,hint:'Piensa en lo que le gusta a {B}.',why:'Cada persona quiere cosas distintas. Para alegrar a alguien, pensamos en lo que le gusta a esa persona.'},
{id:'m4',t:'mind',lv:[0],k:'choice',scene:'{a} 👀 📦⚽   {b} 🙈',story:'{A} mira dentro de la caja y ve una pelota. {B} tiene los ojos tapados y no mira.',q:'¿Quién sabe qué hay en la caja?',o:['{A}','{B}','Los dos'],ok:0,hint:'¿Quién miró?',why:'Quien mira, sabe. {B} no miró, así que todavía no lo sabe.'},
{id:'m5',t:'mind',lv:[0,1],k:'choice',scene:'🏃 💥 😮',story:'{A} va corriendo y, sin querer, choca con {B}. {A} abre mucho los ojos y dice “¡Ay!”.',q:'¿{A} quiso chocar?',o:['No, fue sin querer','Sí, quiso hacer daño'],ok:0,hint:'Mira la cara de {A} y lo que pasó.',why:'Fue un accidente: la cara de sorpresa y el “¡Ay!” son pistas. Cuando es sin querer, se puede decir “no pasa nada” y ayudar.'},
{id:'m6',t:'mind',lv:[1,2],k:'choice',scene:'{a} 🎁🤫  {b} 👂',story:'{A} prepara un regalo sorpresa para {B}. {B} escuchó el secreto sin querer, pero {A} no se dio cuenta de que {B} escuchó.',q:'¿Qué cree {A}?',o:['Que {B} ya sabe la sorpresa','Que {B} no sabe nada de la sorpresa','Que {B} no quiere regalos'],ok:1,hint:'¿{A} sabe que {B} escuchó?',why:'{A} cree que {B} no sabe, aunque en realidad sí sabe. Pensar en lo que otra persona piensa es un nivel más difícil: ¡lo lograste!'},
{id:'m7',clues:['Lo que dice: “no importa”.','Cómo lo dice: voz bajita, boca apretada, mirada al suelo.','Lo que pasó: perdió el juego.','Cuando las palabras y el cuerpo no coinciden, el cuerpo da más información.'],t:'mind',lv:[1,2,3,4],k:'choice',scene:'{a} 😶 “No importa…”',story:'{A} perdió el juego y dice “no importa” con voz bajita, la boca apretada y mirando al suelo.',q:'¿Qué puede estar sintiendo {A} de verdad?',o:['Alegría','Tristeza o rabia, aunque diga que no','No siente nada'],ok:1,hint:'Mira qué dicen la voz, la boca y la mirada.',why:'A veces escondemos lo que sentimos. La voz, la cara y el cuerpo dan pistas. Si te importa, puedes preguntar: “¿Quieres contarme?”.'},
{id:'m8',t:'mind',lv:[1,2],k:'choice',scene:'{a} 👀 6️⃣ ↔ 9️⃣ 👀 {b}',story:'En el suelo hay un número grande. {A} lo mira desde un lado y dice “¡Es un 6!”. {B} lo mira desde el lado contrario y dice “¡Es un 9!”.',q:'¿Quién tiene razón?',o:['Solo {A}','Solo {B}','Los dos: miran desde lugares distintos'],ok:2,hint:'¿Desde dónde mira cada uno?',why:'Desde cada lugar se ve distinto. Cuando hay un desacuerdo, ayuda preguntar: “¿Desde dónde lo ves tú?”.'},
{id:'m9',clues:['Lo que dice: “¡Qué día perfecto!”.','Lo que pasa: llueve fuerte y {A} se cayó al charco.','La cara de {B}: cansada, no contenta.','Si lo que dice no coincide con lo que pasa y con su cara, puede ser ironía: dice lo contrario de lo que siente.'],t:'mind',lv:[2,3,4],k:'choice',scene:'🌧️ {a}💦 😒',story:'Está lloviendo a cántaros. {A} se cae en un charco y {B} dice, con cara de cansancio: “¡Qué día perfecto!”.',q:'¿Qué quiso decir {B}?',o:['Que de verdad le encanta este día','Que el día va mal; lo dijo al revés (ironía)','Que quiere ir a nadar'],ok:1,hint:'Compara lo que dice con su cara y con lo que pasó.',why:'La ironía dice una cosa para decir lo contrario. Las pistas son el tono de voz, la cara y la situación. Si dudas, puedes preguntar: “¿Lo dices en serio?”.'},
{id:'m10',clues:['Lo que dijo {A}: algo malo de una camiseta.','Quién estaba detrás: {B}, con esa camiseta.','{A} no sabía que {B} estaba ahí.','Decir algo sin saber que afecta a alguien es una metida de pata y se arregla con una disculpa corta.'],t:'mind',lv:[2,3,4],k:'choice',scene:'{a} 💬 😬 {b} 👕',story:'En el recreo {A} dice: “¡Qué fea esa camiseta del equipo rojo!”. Sin darse cuenta, {B}, que está justo detrás, lleva puesta esa camiseta.',q:'¿Qué puede hacer {A} al darse cuenta?',o:['Hacerse el distraído y no decir nada','Decir: “Perdón, no vi que estabas ahí. Cada uno tiene su equipo”','Reírse más fuerte'],ok:1,hint:'Una disculpa corta y sincera repara.',why:'Se llama “metida de pata”: pasa porque {A} no sabía algo. Lo mejor es disculparse en breve, sin dramatizar, y seguir.'},
{id:'m11',clues:['La frase: “mariposas en la guata”.','¿Hay mariposas de verdad? No: es una forma de decir otra cosa.','Cuándo lo dice: antes de salir al escenario.','Antes de actuar, muchas personas sienten nervios en la guata.'],t:'mind',lv:[1,2],k:'choice',scene:'{a} 🦋🦋 en la guata',story:'Antes de salir al escenario, {A} dice: “Tengo mariposas en la guata”.',q:'¿Qué quiere decir?',o:['Que tiene nervios','Que se comió unas mariposas','Que tiene hambre'],ok:0,hint:'Es una frase con otro significado.',why:'Hay frases que no significan lo que dicen palabra por palabra. Si no la entiendes, puedes preguntar: “¿Qué quieres decir con eso?”. ¡Preguntar es muy inteligente!'},
{id:'m12',t:'mind',lv:[2,3,4],who:'alone',k:'choice',scene:'🎁🖼️ 😬',story:'{B} te regala un dibujo que hizo con mucho esfuerzo. A ti no te gusta tanto, pero ves que {B} espera tu reacción.',q:'¿Qué dirías?',o:['“Está horrible”','“Gracias por hacerlo para mí. Me gusta cómo usaste los colores”','Nada, y me voy'],ok:1,hint:'¿Puedes decir algo verdadero y amable a la vez?',why:'Se puede ser sincero y amable: eliges algo verdadero y bueno para decir. No hace falta decir todo lo que piensas, ni mentir.'},

{id:'e1',t:'emo',lv:[0],k:'choice',scene:'{a} 🎉🎈',story:'{A} salta y se ríe porque llegó su mejor amigo.',q:'¿Qué siente {A}?',o:['😀 Alegría','😢 Tristeza','😠 Rabia'],ok:0,hint:'Mira la sonrisa y los saltos.',why:'La sonrisa y los saltos muestran alegría.'},
{id:'e2',t:'emo',lv:[0],k:'choice',scene:'{b} 🍦💧 😢',story:'A {B} se le cayó el helado al suelo. Tiene los ojos mojados y la boca hacia abajo.',q:'¿Qué siente {B}?',o:['😀 Alegría','😢 Tristeza','😮 Sorpresa'],ok:1,hint:'Mira los ojos y la boca.',why:'Las lágrimas y la boca hacia abajo muestran tristeza. Podemos ayudar con un abrazo o con palabras amables.'},

{id:'e4',t:'emo',lv:[0,1,2],k:'choice',open:true,scene:'😠 ➜ ✊ 🔥 💓',story:'Cuando sientes rabia, tu cuerpo avisa antes que tu cabeza.',q:'¿Dónde sientes tú la rabia?',o:['En las manos (puños apretados)','En la cara (caliente)','En la guata (un nudo)','En el pecho (late fuerte)'],why:'¡Todas sirven! Tu cuerpo te avisa. Si lo notas a tiempo, puedes parar, respirar y elegir qué hacer.'},
{id:'e5',t:'emo',lv:[0,1,2,3,4],k:'scale',scene:'🌡️',story:'El termómetro de emociones dice qué tan grande es lo que sientes. No hay números malos.',q:'¿Cómo está tu cuerpo ahora mismo?'},

{id:'e7',t:'emo',lv:[1,2,3,4],who:'alone',k:'choice',scene:'🎉 ¿y ahora?',story:'{A} quiere ir a la fiesta, pero siente miedo. Te pide un consejo.',q:'¿Qué plan le ayuda más?',o:['Ir con alguien de confianza, quedarse un ratito y después decidir si sigue','No ir nunca a ninguna fiesta','Ir y no hablar con nadie'],ok:0,hint:'Un paso pequeño es más fácil que uno gigante.',why:'Un paso pequeño ayuda: ir acompañado, quedarse poco y decidir después. Así el miedo baja sin obligarte a todo de golpe.'},
{id:'e8',t:'emo',lv:[1,2,3,4],who:'alone',k:'choice',scene:'🧱💥 😤',story:'Estás armando algo y se desarma por tercera vez. Sientes ganas de romperlo todo.',q:'¿Qué haces primero?',o:['Respiro, suelto las manos y pido un descanso','Lo rompo','Me digo “soy un fracaso”'],ok:0,hint:'Primero calma al cuerpo.',why:'La frustración baja cuando le das una pausa. Equivocarse es parte de aprender: el cerebro aprende más cuando prueba de nuevo.'},
{id:'e9',t:'emo',lv:[2,3,4],who:'alone',k:'choice',scene:'🌙📝 💭',story:'Mañana hay una prueba y no puedes dormir pensando “me va a ir mal”.',q:'¿Qué pensamiento te ayuda más?',o:['“Estudié lo que pude y, si no entiendo algo, puedo pedir ayuda”','“Seguro repruebo”','“Da lo mismo, nada importa”'],ok:0,hint:'Busca el pensamiento realista y amable contigo.',why:'Los pensamientos cambian cómo nos sentimos. Un pensamiento realista y amable baja los nervios; el catastrofista los sube.'},

{id:'c1',t:'conf',lv:[0,1],k:'choice',scene:'{a} 🧸 ⚔️ 🧸 {b}',story:'{A} y {B} quieren el mismo juguete al mismo tiempo.',q:'¿Qué pueden hacer?',o:['Turnos: primero uno y después el otro','Gritar más fuerte','Quitárselo'],ok:0,hint:'Una idea donde juegan los dos.',why:'Los turnos ayudan a que los dos jueguen. Se puede usar un reloj de arena o contar hasta 20.'},

{id:'c4',t:'conf',lv:[1,2,3,4],k:'choice',scene:'{b} 💥🖼️',story:'{B} rompió sin querer tu dibujo. Sientes mucha rabia.',q:'¿Qué frase ayuda más?',o:['“Eres un torpe”','“Me siento triste porque se rompió mi dibujo. ¿Me ayudas a arreglarlo?”','No decir nada y no hablarle más'],ok:1,hint:'Di cómo te sientes y qué necesitas.',why:'Decir “me siento… cuando… necesito…” se llama mensaje yo. Hace que te escuchen sin pelear.'},
{id:'c5',t:'conf',lv:[1,2,3,4],k:'say',scene:'🗣️',story:'Practica el mensaje yo. Elige una frase, dila en voz alta (o muéstrasela a tu adulto) y marca cuando lo hiciste.',q:'Mensaje yo',phrases:['Me da rabia cuando me interrumpen. Necesito terminar mi idea.','Me siento mal cuando me quitan mis cosas. Necesito que me las pidan.','Me asusta cuando gritan. Necesito que hablen más despacio.']},
{id:'c6',t:'conf',lv:[1,2,3,4],who:'alone',k:'choice',scene:'⚽ ↔ 🃏',story:'Tú quieres jugar fútbol en el recreo y {B} quiere jugar cartas.',q:'¿Qué solución sirve para los dos?',o:['Primero 10 minutos de cada juego','Siempre lo que yo quiero','No juego nunca más con {B}'],ok:0,hint:'Busca algo en lo que ganen los dos.',why:'Negociar es buscar algo que funcione para los dos. Los turnos y las mitades son soluciones clásicas.'},
{id:'c7',t:'conf',lv:[2,3,4],k:'choice',scene:'📱😞 👥',story:'En el curso, varios se burlan de un compañero que lo está pasando mal. Tú lo ves.',q:'¿Qué es lo más útil y seguro?',o:['Reírme para que no me hagan lo mismo','Acompañar a esa persona y avisar a un adulto de confianza','Hacer como que no vi'],ok:1,hint:'Ayudar no significa ponerte en peligro.',why:'Ser testigo cuenta. Puedes ayudar sin ponerte en peligro: acompañar, no reírte y avisar a un adulto.'},
{id:'c8',t:'conf',lv:[0,1,2,3,4],who:'alone',k:'choice',scene:'🤗 ✋',story:'Un amigo quiere abrazarte, pero hoy no tienes ganas.',q:'¿Qué dices?',o:['“Hoy no quiero abrazo, pero sí chocar la mano”','Lo empujo','Me dejo abrazar aunque no quiera'],ok:0,hint:'Tu cuerpo es tuyo.',why:'Puedes decir que no con respeto y proponer otra cosa. También respetamos cuando otros dicen que no.'},
{id:'c9',t:'conf',lv:[3,4],k:'choice',scene:'🧑‍🤝‍🧑 💢 🗣️🗣️🗣️',story:'En un trabajo grupal todos hablan a la vez y nadie escucha.',q:'¿Qué propones?',o:['Turnos de un minuto para cada idea y después votar','Hacerlo yo solo','Hablar más fuerte que los demás'],ok:0,hint:'Una regla simple que todos puedan seguir.',why:'Ordenar la conversación con turnos y una forma de decidir baja la tensión. Proponer una regla es liderar sin mandar.'},
{id:'c10',t:'conf',lv:[2,3,4],who:'alone',k:'choice',scene:'🎂 ↔ ⚽',story:'El mismo día tienes el cumpleaños de un amigo y el entrenamiento. Quieres ir a los dos y no puedes.',q:'¿Qué haces?',o:['Pienso qué es más importante hoy, elijo y aviso con cariño a la otra parte','No contesto ningún mensaje','Digo que sí a los dos y falto a uno sin avisar'],ok:0,hint:'Decidir y avisar a tiempo cuida a los demás.',why:'Tener dos deseos a la vez es un conflicto interno normal. Pensar los pros y los contras, decidir y avisar a tiempo cuida tu relación con las personas.'},
/* ---- Conversar ---- */
{id:'t1',t:'talk',lv:[0,1],k:'choice',scene:'⚽ 👦👧 ➜ 🙋',story:'Hay niños jugando a la pelota y tú quieres jugar.',q:'¿Qué puedes decir?',o:['“¿Puedo jugar con ustedes?”','Llevarme la pelota','Quedarme mirando sin decir nada'],ok:0,hint:'Una pregunta amable abre la puerta.',why:'Pedir entrar al juego con una pregunta amable funciona. Si dicen que no, puedes buscar otro juego: no es tu culpa.'},
{id:'t2',t:'talk',lv:[0,1],k:'choice',scene:'{b} 🐕 💬',story:'{B} te cuenta que tiene un perro nuevo.',q:'¿Qué puedes hacer para seguir la conversación?',o:['Preguntar: “¿Cómo se llama?”','Hablar solo de lo mío','Irme sin decir nada'],ok:0,hint:'Conversar es como pasar una pelota.',why:'Conversar es pasar la pelota: me toca, te toca. Una pregunta devuelve la pelota a la otra persona.'},
{id:'t3',t:'talk',lv:[0,1],k:'say',scene:'👋',story:'Practica presentarte. Elige una frase, dila en voz alta (o muéstrala) y marca cuando lo hiciste.',q:'Saludar y presentarme',phrases:['Hola, me llamo {yo}. ¿Y tú?','Hola, ¿quieres jugar conmigo?','Hola, me interesa {topic}. ¿Y a ti qué te interesa?']},
{id:'t4',t:'talk',lv:[0,1,2],k:'choice',scene:'🎨 {b}',story:'{B} te muestra un dibujo que hizo.',q:'¿Qué puedes decirle?',o:['“Me gustan los colores que usaste”','“Está feo”','Nada'],ok:0,hint:'Algo que de verdad notaste y es amable.',why:'Un comentario amable y concreto, sobre algo que de verdad notaste, hace sentir bien a la otra persona.'},
{id:'t5',t:'talk',lv:[1,2,3,4],who:'alone',k:'choice',scene:'📝 ❓',story:'No entiendes una parte de la tarea.',q:'¿Cómo pides ayuda?',o:['Levanto la mano y digo: “No entendí esta parte, ¿me la explicas?”','Me quedo callado y espero que pase','Rompo la hoja'],ok:0,hint:'Di qué parte no entiendes.',why:'Pedir ayuda es una habilidad fuerte. Decir qué parte no entiendes hace que la ayuda sea más rápida.'},
{id:'t6',t:'talk',lv:[1,2],k:'choice',scene:'{a} 💬💬💬 {b} 🥱',story:'Te encantan {topic}. Hablas mucho de eso y {B} bosteza, mira hacia otro lado y dice “ajá”.',q:'¿Qué pista te da {B}?',o:['Quizás se cansó del tema: puedo preguntarle a {B} qué es lo que más le gusta','Hablar más fuerte para que escuche','Seguir igual: no pasa nada'],ok:0,hint:'Mira el bostezo y la mirada.',why:'Tus intereses son geniales y puedes compartirlos. Para que la conversación sea de los dos, dejamos un espacio y preguntamos por lo que le gusta a la otra persona.'},
{id:'t7',clues:['Lo que hace el cuerpo: brazos cruzados y mira el reloj.','Lo que dice: una sola palabra.','Son pistas, no certezas: no sabemos seguro.','Cuando dudamos, podemos preguntar con calma.'],t:'talk',lv:[1,2,3,4],k:'choice',scene:'{b} 🙅 ⌚ 💬',story:'Mientras hablas, {B} cruza los brazos, mira el reloj y responde con una sola palabra.',q:'¿Qué puede significar?',o:['Quizás tiene apuro o no quiere seguir; puedo preguntar “¿seguimos otro rato?”','Seguro me odia','Que quiere que hable más fuerte'],ok:0,hint:'El cuerpo da pistas, pero no certezas.',why:'El cuerpo da pistas, pero solo son pistas: no sabemos seguro. Lo mejor es preguntar con calma en vez de suponer lo peor.'},
{id:'t8',t:'talk',lv:[1,2,3,4],k:'choice',scene:'🚪 👋',story:'Tienes que irte, pero la conversación sigue.',q:'¿Cómo terminas bien?',o:['“Me tengo que ir, ¡hablamos luego!”','Me voy sin decir nada','Me quedo aunque tenga que irme'],ok:0,hint:'Avisar es parte de ser amable.',why:'Avisar que te vas y despedirte hace que la otra persona no se confunda ni se sienta ignorada.'},
{id:'t9',t:'talk',lv:[2,3,4],k:'say',scene:'✋ 🙂',story:'Decir que no con respeto se practica. Elige una frase, dila (o muéstrala) y marca cuando lo hiciste.',q:'Decir que no',phrases:['No, gracias, prefiero no hacerlo.','Hoy no puedo, quizás otro día.','Eso no me gusta. ¿Hacemos otra cosa?']},
/* ---- Calma y sentidos ---- */
{id:'k1',t:'calm',lv:[0,1,2,3,4],k:'breathe',scene:'🎈',story:'Respira con el globo: cuando sube, inspira y cuenta 1, 2, 3, 4. Cuando baja, suelta el aire y cuenta hasta 6. Si respiras muy rápido, cuenta más lento. Toca el botón para empezar y vuelve a tocarlo si quieres parar.',q:'Respiración de globo'},
{id:'k2',t:'calm',lv:[0,1,2,3,4],k:'senses',scene:'👀 ✋ 👂 👃 👅',story:'Mira a tu alrededor con calma. Por cada cosa que encuentres, toca un círculo. Por ejemplo: veo una mesa, entonces toco un círculo en “ves”.',q:'Encuentra cosas con tus sentidos'},
{id:'k3',t:'calm',lv:[0,1,2,3,4],k:'steps',scene:'💪 😮‍💨',story:'Tu cuerpo puede soltar la tensión. Sigue los pasos con calma.',q:'Aprieta y suelta',steps:['Aprieta tus manos fuerte, como si exprimieras un limón 🍋','Ahora suelta. Siente tus manos blandas.','Sube los hombros hasta las orejas.','Suéltalos de golpe. ¡Ahhh! 😮‍💨','Cierra los ojos un momento y respira lento.','Abre los ojos. ¿Cómo está tu cuerpo ahora?']},
{id:'k4',t:'calm',lv:[0,1,2,3,4],k:'steps',scene:'{a} 🏃  {b} 🐢',story:'Si tu cuerpo necesita movimiento, hagamos una pausa activa.',q:'Pausa de movimiento',steps:['Salta 5 veces como {A}.','Camina muy lento, como {B}.','Estírate hacia el cielo y cuenta hasta 5.','Sacude las manos y los pies.','Siéntate y respira 3 veces.']},
{id:'k5',t:'calm',lv:[0,1,2,3,4],k:'choice',open:true,calmtool:true,scene:'🧰',story:'Cada cuerpo se calma de manera distinta. Elige lo que más te ayuda cuando sientes mucho. Puedes elegir más de uno.',q:'¿Qué te ayuda a calmarte?',o:['🤗 Un abrazo fuerte o una manta pesada','🎧 Silencio o música suave','🌙 Luz tenue y un lugar tranquilo','🏃 Moverme o saltar'],why:'Guardé tu elección en tu caja de calma. Tu adulto la puede ver en la pestaña Familia.'},
/* ---- En familia (solo con adulto) ---- */
{id:'f1',t:'team',lv:[0,1,2,3,4],who:'together',k:'together',scene:'🎭 😀 😢 😠',story:'Un juego de caras para jugar juntos.',q:'Adivina la emoción',tasks:['Uno hace una cara de emoción sin hablar y el otro adivina. Digan en qué se fijaron (cejas, boca, ojos).','Cambian de turno.','Cada uno cuenta una vez en que sintió esa emoción.'],adult:'Valide antes de aconsejar. Si aparece una emoción difícil, nómbrela sin juzgar: “Parece rabia. Es normal sentirla”.'},
{id:'f2',t:'team',lv:[0,1],who:'together',k:'together',scene:'📦 🧸 🔄 📦',story:'Un teatro para entender qué piensan los demás.',q:'¿Dónde va a buscar?',tasks:['El adulto sale de la habitación (o cierra los ojos) mientras tú escondes un objeto en la caja A.','Mientras el adulto no ve, cambias el objeto a la caja B.','Antes de que vuelva, te preguntan: “¿Dónde va a buscar?”.','El adulto busca donde creía que estaba. ¡Y explican por qué!'],adult:'Si responde “en la caja B”, pregunte con curiosidad: “¿Yo vi el cambio?”. No corrija enseguida; deje que lo descubra y repitan cambiando de papeles.'},
{id:'f3',t:'team',lv:[0,1],k:'order',scene:'🌙',story:'Una rutina que se repite da tranquilidad. Toca los pasos de la noche en orden.',q:'Rutina de la noche',steps:['🛁 Baño','👕 Pijama','🦷 Dientes','📖 Cuento','💡 Luz apagada'],why:'Saber qué viene después da calma. Pueden dibujarla juntos y pegarla en la pared.',adult:'Una rutina visual reduce las discusiones de la noche. Anticipe cada paso y mantenga el mismo orden varios días.'},
{id:'f4',t:'team',lv:[1,2,3,4],who:'together',k:'together',scene:'📱 ⏰ 🤝',story:'Un acuerdo hecho entre los dos funciona mejor que una orden.',q:'Acuerdo de pantallas',tasks:['Cada uno dice qué es lo que más le gusta de las pantallas.','Elijan juntos cuánto tiempo, a qué hora y dónde se guardan los aparatos.','Decidan qué pasa cuando se acaba el tiempo: aviso 5 minutos antes, guardar la partida y qué actividad sigue.','Escríbanlo o dibújenlo y péguenlo a la vista.'],adult:'Un acuerdo que el niño, la niña o adolescente ayudó a escribir se cumple más que una regla impuesta. Avise 5 minutos antes y mantenga lo acordado con calma.'},
{id:'f5',t:'team',lv:[2,3,4],who:'together',k:'together',scene:'🪑 🗣️ 👂',story:'Escuchar sin arreglar es una habilidad para toda la familia.',q:'Dos minutos sin consejos',tasks:['Uno habla 2 minutos sobre algo que le preocupa y algo que le ilusiona.','El otro solo escucha y al final dice: “Lo que escuché fue…”.','Cambian de turno.'],adult:'El desafío es no aconsejar ni corregir. Pregunte: “¿Quieres consejo o solo que te escuche?”. Esto abre la conversación en la adolescencia.'},
{id:'f6',t:'team',lv:[0,1,2,3,4],who:'together',k:'together',scene:'🌅 🤝',story:'Después de una pelea, reparar es más importante que tener razón.',q:'Hacer las paces',tasks:['Respiren juntos tres veces.','Cada uno dice: “Yo hice… y me sentí…”.','Cada uno dice una cosa que puede hacer distinto la próxima vez.','Terminen con algo que les guste: un abrazo, chocar las manos o una sonrisa.'],adult:'Modele primero: asuma su parte y use mensajes yo. Reparar enseña más que ganar la discusión.'},
/* ---- Mundo online ---- */
{id:'d1',t:'digi',lv:[0,1],k:'choice',scene:'⏰ 📱 ➜ 🧸',story:'Suena la alarma: se acabó el tiempo de la tablet.',q:'¿Qué hago?',o:['La apago, la guardo y voy a mi siguiente actividad','Grito y sigo jugando','La escondo para jugar después'],ok:0,hint:'Un plan hace más fácil dejar la pantalla.',why:'Es difícil dejar algo que te gusta. Ayuda tener un plan: apagar, guardar y saber qué viene después.'},
{id:'d2',t:'digi',lv:[0,1],who:'alone',k:'choice',scene:'🖥️ 👤 ❓',story:'Alguien que no conoces te escribe en el juego: “Hola, ¿dónde vives?”.',q:'¿Qué haces?',o:['No contesto y busco a mi adulto','Le digo dónde vivo','Le mando una foto'],ok:0,hint:'Los datos personales se cuidan.',why:'Nunca des tu dirección, tu colegio ni fotos a personas que no conoces. Siempre se lo cuentas a un adulto de confianza, aunque parezca amable.'},
{id:'d3',t:'digi',lv:[1,2,3,4],who:'alone',k:'choice',scene:'🎮 💬 😠',story:'En un juego en línea, alguien te escribe: “Eres malísimo”.',q:'¿Qué haces?',o:['Silencio o bloqueo a esa persona y sigo con quienes me tratan bien','Insulto de vuelta','Dejo de jugar para siempre'],ok:0,hint:'No tienes que responder a todo.',why:'Silenciar y bloquear son herramientas para cuidarte. Si el trato es grave, guarda una captura de pantalla y cuéntaselo a un adulto.'},
{id:'d4',clues:['Lo que escribe: “ok.”, sin emojis.','En un mensaje no se ve la cara ni se escucha la voz.','Puede significar muchas cosas: apuro, cansancio o enojo.','Si dudas, pregunta: “¿Todo bien?”.'],t:'digi',lv:[2,3,4],k:'choice',scene:'📩 “ok.” 🤔',story:'Le escribes a {B} y responde solo “ok.”, sin emojis. Te quedas dándole vueltas.',q:'¿Qué haces?',o:['Recuerdo que no veo su cara ni oigo su voz: puedo preguntar “¿todo bien?”','Pienso que seguro está enojado y no le hablo más','Le mando 20 mensajes seguidos'],ok:0,hint:'En un mensaje faltan la cara y la voz.',why:'En los mensajes faltan la cara y la voz, así que es fácil entender mal. Pregunta antes de suponer lo peor.'},
{id:'d5',t:'digi',lv:[2,3,4],who:'alone',k:'choice',scene:'📸 😂 ➜ ❓',story:'Tienes una foto muy graciosa de un compañero y quieres subirla al grupo.',q:'¿Qué haces primero?',o:['Pregunto si está de acuerdo; si no quiere, no la subo','La subo rápido','La subo sin su nombre'],ok:0,hint:'La foto de otra persona necesita su permiso.',why:'Una foto de otra persona necesita su permiso. Lo que se sube en línea puede quedar para siempre y herir.'},
{id:'d6',t:'digi',lv:[2,3,4],k:'choice',scene:'📰 ❗ 📲',story:'Te llega un video que dice “Mañana cierran todos los colegios”. Todos lo comparten.',q:'¿Qué haces antes de compartirlo?',o:['Reviso en una fuente confiable (el colegio, un diario o un sitio oficial)','Lo comparto ya','Lo creo porque lo comparten muchos'],ok:0,hint:'Que algo se comparta mucho no lo hace verdadero.',why:'Antes de compartir pregúntate: ¿quién lo dice? ¿hay otra fuente confiable? Que algo se comparta mucho no lo hace verdadero.'},
{id:'d7',t:'digi',lv:[3,4],k:'choice',scene:'🤖 💬 📚',story:'Un chat de inteligencia artificial te da la respuesta de una tarea con mucha seguridad.',q:'¿Cómo la usas?',o:['La reviso en otra fuente y la explico con mis palabras','La copio tal cual','Pienso que es una persona que me entiende mejor que nadie'],ok:0,hint:'La seguridad con que habla no es prueba de que esté bien.',why:'La IA puede equivocarse aunque suene muy segura, y no es una persona. Sirve de apoyo, pero tú piensas, verificas y decides.'},
{id:'d8',t:'digi',lv:[2,3,4],who:'alone',k:'choice',scene:'📱 😞 💬',story:'Descubres que hay un chat del curso donde no te incluyeron.',q:'¿Qué haces?',o:['Respiro, hablo con alguien de confianza y, si quiero, pregunto con calma a un compañero','Escribo insultos en el chat','Me aíslo y digo que no me importa'],ok:0,hint:'Primero calma el cuerpo, después decide.',why:'Sentirse dejado afuera duele. Hablar con alguien de confianza y preguntar con calma cuida tu ánimo y tus relaciones.'},
{id:'d9',t:'digi',lv:[2,3,4],who:'alone',k:'choice',scene:'🎥 ⚠️',story:'Te retan a hacer algo peligroso para grabar un video.',q:'¿Qué haces?',o:['Digo que no, aunque me digan cobarde, y propongo otra idea','Lo hago para que no se rían','Lo hago pero sin que nadie lo sepa'],ok:0,hint:'Cuidar tu cuerpo es lo primero.',why:'Decir que no a algo peligroso es valentía. Las personas que te quieren no te piden arriesgarte.'},
{id:'d10',t:'digi',lv:[2,3,4],who:'alone',k:'choice',scene:'🎮 ⏰ 💾',story:'Estás en lo mejor del juego y se acerca la hora de terminar.',q:'¿Qué plan te ayuda más?',o:['Pedir 5 minutos antes de que termine, guardar la partida y pasar a lo siguiente de mi lista','Seguir a escondidas','Enojarme y no hablar con nadie'],ok:0,hint:'Un plan hecho antes ayuda más que decidir enojado.',why:'Pedir tiempo antes y tener un plan para lo que sigue hace más fácil terminar. Es una forma de autonomía: tú organizas tu tiempo.'},
/* ---- ampliación v12: nivel 1 (4 a 6 años) ---- */
{id:'m13',t:'mind',lv:[0],k:'choice',scene:'{a} 📞✋',story:'{A} pone la mano en la oreja, como un teléfono, y dice “¿Aló? ¿Aló?”.',q:'¿Qué hace {A}?',o:['Juega a que habla por teléfono','Se hizo daño en la oreja'],ok:0,hint:'Mira si {A} está jugando o si le duele algo.',why:'{A} está jugando a que hace algo. Jugar “a que…” también es leer la mente: sabemos que es de mentira.'},
{id:'m14',t:'mind',lv:[0],k:'choice',scene:'{b} 🚪 {a} 🍪🤫',story:'{B} salió de la sala. Mientras tanto, {A} escondió una galleta debajo de la mesa.',q:'¿{B} sabe dónde está la galleta?',o:['No, porque no vio','Sí, lo sabe'],ok:0,hint:'¿{B} estaba mirando?',why:'Quien no vio, no sabe. {B} puede buscar en otro lugar, y eso no es una mentira: solo no lo sabe.'},
{id:'e11',t:'emo',lv:[0],k:'choice',scene:'{a} 🎁 😮',story:'{A} abre un regalo. Pone la boca en forma de O y abre mucho los ojos.',q:'¿Qué siente {A}?',o:['😮 Sorpresa','😠 Rabia','😢 Tristeza'],ok:0,hint:'Mira la boca y los ojos.',why:'La boca en O y los ojos muy abiertos muestran sorpresa. La sorpresa puede ser buena o no tan buena.'},
{id:'e12',t:'emo',lv:[0],k:'choice',scene:'{b} 🧸💢 ✊',story:'Le quitaron el juguete a {B}. Aprieta los puños y baja las cejas.',q:'¿Qué siente {B}?',o:['😠 Rabia','😀 Alegría','😴 Sueño'],ok:0,hint:'Mira los puños y las cejas.',why:'Los puños apretados y las cejas hacia abajo muestran rabia. La rabia se puede calmar con respiración.'},
{id:'e13',t:'emo',lv:[0],k:'choice',scene:'{a} 😠 ➜ 🌸 🕯️',story:'{A} siente mucha rabia y quiere pegar.',q:'¿Qué le ayuda?',o:['Oler la flor y soplar la vela 🌸🕯️','Pegar','Tirar cosas'],ok:0,hint:'Primero calmamos el cuerpo.',why:'Respirar lento calma el cuerpo. Después se puede decir con palabras qué pasó.'},
{id:'c11',t:'conf',lv:[0],k:'choice',scene:'🛝 ⏳ {b}',story:'Quieres usar el columpio, pero {B} lo está usando.',q:'¿Qué haces?',o:['Pido turno y espero un poquito ⏳','Lo empujo para bajarlo','Me pongo a gritar'],ok:0,hint:'Esperar también es una forma de jugar juntos.',why:'Pedir turno y esperar permite que los dos usen el columpio. Contar hasta 10 ayuda a esperar.'},
{id:'c12',t:'conf',lv:[0,1],k:'choice',scene:'{b} 😢 {a} 🤝',story:'Ves que {B} está llorando solo.',q:'¿Qué puedes hacer?',o:['Preguntarle: “¿Quieres ayuda?”','Reírme','Irme corriendo'],ok:0,hint:'Una pregunta amable ayuda.',why:'Preguntar “¿quieres ayuda?” muestra que te importa. Si no quiere, puedes quedarte cerca o avisar a un adulto.'},
{id:'t10',t:'talk',lv:[0],k:'choice',scene:'👦 “¡Hola!” 👋',story:'Un niño te dice “hola”.',q:'¿Qué puedes hacer?',o:['Decir “hola”','Saludar con la mano','Mirar hacia otro lado sin responder'],ok:[0,1],hint:'Hablar o hacer un gesto son dos formas de saludar.',why:'Se puede saludar con palabras o con la mano. Todas las formas de comunicarse valen.'},
{id:'t11',t:'talk',lv:[0,1],who:'alone',k:'choice',scene:'😣 🤰',story:'Te duele la guata en el colegio.',q:'¿Qué haces?',o:['Aviso a un adulto: “Me duele la guata”','Me aguanto y no digo nada'],ok:0,hint:'Los adultos pueden ayudar si saben.',why:'Avisar cuando algo te duele o te molesta es una forma de cuidarte. Los adultos pueden ayudar si lo saben.'},
{id:'d11',t:'digi',lv:[0,1],who:'alone',k:'choice',scene:'📱 ✋ 🕐',story:'Quieres ver un video, pero tu adulto dice que hoy no.',q:'¿Qué haces?',o:['Respiro y pregunto cuándo sí puedo','Grito y lloro','Tomo el celular igual'],ok:0,hint:'Primero calma el cuerpo y después pregunta.',why:'Cuando nos dicen que no, el cuerpo se enoja. Respirar y preguntar “¿cuándo sí?” ayuda a ponernos de acuerdo.'},
{id:'f7',t:'team',lv:[0,1],who:'together',k:'together',scene:'📦 🧸 🧴 🎧',story:'Una caja de calma es un lugar para guardar cosas que ayudan cuando hay mucha emoción.',q:'Armamos nuestra caja de calma',tasks:['Elijan una caja o bolsa y decórenla juntos.','Pongan 3 cosas que calmen: algo suave, algo para apretar y algo para mirar u oler.','Elijan dónde se guarda para que siempre esté a la mano.','Practiquen: sientan una emoción grande y usen la caja juntos.'],adult:'Que el niño o la niña elija las cosas. Ofrezca la caja sin obligar y úsela también usted cuando esté estresado: así aprende que calmarse es normal.'},
{id:'k6',t:'calm',lv:[0,1,2,3,4],k:'steps',scene:'🦋 🤗',story:'El abrazo de mariposa ayuda a calmar el cuerpo y la mente.',q:'Abrazo de mariposa',steps:['Cruza los brazos sobre el pecho, como alas de mariposa.','Golpea suave con tus manos, un lado y luego el otro, despacio.','Respira lento mientras golpeas despacito. Hazlo 10 veces.','Suelta los brazos. ¿Cómo está tu cuerpo ahora?']},
/* ---- ampliación v12: niveles 2 y 3 (7 a 12 años) ---- */
{id:'m15',clues:['Lo que dice: “no quiero jugar”.','Lo que hace: mira el juego y se queda cerca.','Cuando lo que dice y lo que hace no coinciden, puede sentir otra cosa.'],t:'mind',lv:[1,2],k:'choice',scene:'{a} 🙅 👀 {b} 🎲',story:'{A} dice “no quiero jugar”, pero mira de reojo el juego de {B} y se queda cerca.',q:'¿Qué puede estar pasando?',o:['Quizás sí quiere jugar, pero le da vergüenza pedirlo','{A} odia a {B}','No le importa nada'],ok:0,hint:'Mira lo que hace, no solo lo que dice.',why:'A veces lo que decimos no coincide con lo que queremos. Mirar lo que hace una persona da pistas. Puedes invitarla otra vez sin presionar.'},
{id:'e13b',t:'emo',lv:[1,2],who:'alone',k:'choice',scene:'📖 😳 😆',story:'Te equivocaste leyendo en voz alta y algunos compañeros se rieron.',q:'¿Qué te ayuda más?',o:['Respirar, decir “me equivoqué, lo intento de nuevo” y seguir','Salir corriendo y no volver a leer','Burlarme de otro para que dejen de reírse de mí'],ok:0,hint:'Equivocarse es parte de aprender.',why:'Todos nos equivocamos. Reconocerlo con calma y volver a intentar es de personas valientes. Si la burla sigue, puedes avisar a un adulto.'},
{id:'e14',t:'emo',lv:[1,2],k:'choice',scene:'{a} 💚 {b} 👀',story:'Ves que {B} juega con otro niño y sientes celos.',q:'¿Qué puedes hacer con esa emoción?',o:['Decir: “Me sentí dejado de lado, ¿podemos jugar los tres?”','Hacer que se peleen','No hablarle más a {B}'],ok:0,hint:'Los celos avisan que quieres cercanía.',why:'Los celos son normales y dicen que quieres estar cerca de alguien. Decirlo con palabras amables ayuda más que enojarse.'},
{id:'c13',t:'conf',lv:[1,2],k:'choice',scene:'{a} ⚡ {b} 🤝 ❓',story:'Dos amigos pelean y cada uno te pide que estés de su lado.',q:'¿Qué haces?',o:['Escucho a los dos y les sugiero que hablen con calma','Me pongo del lado del más fuerte','Les cuento a todos la pelea'],ok:0,hint:'No tienes que elegir un bando.',why:'Puedes ayudar sin tomar partido: escuchar a los dos y sugerir que hablen. Si la pelea es violenta, avisa a un adulto.'},
{id:'c14',t:'conf',lv:[1,2],who:'alone',k:'choice',scene:'🎲 😠 🤥',story:'Estás jugando y sientes que alguien hizo trampa.',q:'¿Qué dices?',o:['“Creo que esa regla no era así. ¿La revisamos?”','“¡Tramposo!” y me voy','No digo nada y me enojo por dentro'],ok:0,hint:'Habla de la regla, no de la persona.',why:'Hablar de la regla y no de la persona evita pelear. Revisar las reglas juntos ayuda a seguir jugando.'},
{id:'t12',t:'talk',lv:[1,2],k:'say',scene:'💬 ❓',story:'Hacer preguntas mantiene viva la conversación. Elige una frase, dila (o muéstrala) y marca cuando lo hiciste.',q:'Preguntar para seguir',phrases:['¿Y tú qué opinas?','¿Cómo fue eso para ti?','¿Y qué haces cuando eso te pasa?']},
{id:'t13',t:'talk',lv:[1,2,3,4],k:'choice',scene:'👥💬 ➜ 🙋',story:'Un grupo de compañeros está conversando y quieres entrar a la conversación.',q:'¿Qué haces?',o:['Escucho un momento y digo algo sobre el tema','Interrumpo con otro tema','Me quedo muy lejos para siempre'],ok:0,hint:'Primero escucha de qué hablan.',why:'Escuchar un momento y decir algo relacionado es una buena forma de entrar. Si no pueden en ese momento, puedes intentarlo otro día.'},
{id:'d14',t:'digi',lv:[1,2],who:'alone',k:'choice',scene:'🎮 🎁 📝',story:'Un juego gratis te pide tu nombre completo, tu edad real y tu dirección.',q:'¿Qué haces?',o:['Le pregunto a un adulto antes de seguir','Lo lleno rápido para jugar','Invento todo y sigo'],ok:0,hint:'Los datos personales valen mucho.',why:'Nombre completo, dirección o colegio no se entregan sin preguntar a un adulto. Algunos juegos gratis usan esos datos para otra cosa.'},
{id:'f8',t:'team',lv:[1,2],who:'together',k:'together',scene:'📚 ⏰ 🤝',story:'Un acuerdo para la tarea reduce las discusiones del día.',q:'Acuerdo de la tarea',tasks:['Elijan juntos a qué hora y dónde se hace la tarea.','Decidan qué se hace primero y cuándo hay descanso.','Acuerden qué hacer si se traba: pedir ayuda, hacer una pausa o seguir mañana.','Escríbanlo o dibújenlo y péguenlo.'],adult:'Ofrezca elegir entre dos opciones razonables: eso da control sin perder estructura. Revise el acuerdo después de una semana y ajústenlo.'},
/* ---- ampliación v12: nivel 4 (13 a 14 años) ---- */
{id:'m16',t:'mind',lv:[3,4],k:'choice',scene:'🧑 “Estoy bien” 😶 📅',story:'Un amigo dice “estoy bien”, pero hace dos semanas que no habla con nadie y se aleja del grupo.',q:'¿Qué puedes hacer?',o:['Preguntarle en privado cómo está y escuchar sin juzgar','Contárselo a todo el curso','Esperar que se le pase solo'],ok:0,hint:'Lo que dice no siempre coincide con cómo está.',why:'Cuando una persona cambia mucho y se aísla, puede estar mal aunque diga que no. Pregunta con calma. Si te preocupa mucho, cuéntale a un adulto de confianza: no es traición.'},
{id:'m17',clues:['Lo que escribe: “genial, gracias por avisar”.','Lo que pasó: olvidaste avisar algo importante.','El emoji 🙃 se usa muchas veces para decir lo contrario.','Si lo que dice no coincide con lo que pasó, puede ser ironía.'],t:'mind',lv:[3,4],k:'choice',scene:'📱 “genial, gracias por avisar 🙃” 🕚',story:'Olvidaste avisar algo importante y a las 11 de la noche te escriben: “genial, gracias por avisar 🙃”.',q:'¿Qué significa?',o:['Está molesto y lo dice al revés (ironía)','Está feliz y te agradece','Quiere que sigas olvidando'],ok:0,hint:'Mira la hora, la situación y el emoji.',why:'El emoji 🙃 y el contexto muestran ironía: dice “gracias” pero siente molestia. Responder con calma y asumir tu parte ayuda: “Tienes razón, me olvidé. Perdón”.'},
{id:'e15',t:'emo',lv:[3,4],k:'choice',scene:'📱 😀😀😀 ➜ 😔',story:'Ves en redes que todos parecen felices, viajando y de fiesta, y tú no te sientes así.',q:'¿Qué pensamiento te ayuda más?',o:['En redes se muestra lo mejor; no veo todo lo que viven','Algo está mal conmigo','Debería mentir y subir fotos falsas'],ok:0,hint:'Compara tu vida real con lo que otros muestran.',why:'Las redes muestran momentos elegidos. Compararte con eso suele hacerte sentir peor. Hablar con alguien de confianza y reducir el tiempo en redes ayuda.'},
{id:'e16',t:'emo',lv:[2,3,4],who:'alone',k:'choice',scene:'📝 5,8 😤',story:'Sacaste un 5,8 en una prueba y esperabas un 7,0.',q:'¿Qué haces primero?',o:['Reviso qué errores tuve y qué puedo practicar','Me digo que soy un fracaso','Rompo la prueba'],ok:0,hint:'Un error es información, no una sentencia.',why:'Una nota dice cómo te fue en una prueba, no cuánto vales. Revisar los errores y pedir ayuda convierte la rabia en un plan.'},
{id:'c15',t:'conf',lv:[3,4],who:'alone',k:'choice',scene:'📝 👀 🧑‍🤝‍🧑',story:'Tu mejor amigo te pide que le dejes copiar durante una prueba.',q:'¿Qué haces?',o:['Digo que no, pero le ofrezco estudiar juntos','Lo dejo para no perder la amistad','Lo acuso con todo el curso'],ok:0,hint:'Puedes cuidar la amistad y decir que no.',why:'Decir que no a algo que te perjudica no destruye una amistad. Ofrecer otra ayuda muestra que te importa.'},
{id:'c16',t:'conf',lv:[3,4],k:'choice',scene:'🏠 🕙 💬',story:'Tus papás y tú no están de acuerdo sobre la hora de volver a casa.',q:'¿Cuál es una buena forma de negociar?',o:['Proponer una hora con razones, escuchar las suyas y probar una semana','Volver más tarde sin avisar','Gritar que nunca te entienden'],ok:0,hint:'Mostrar responsabilidad ayuda a que confíen.',why:'Negociar es escuchar, proponer y probar. Cumplir lo acordado construye confianza para pedir más libertad después.'},
{id:'t14',t:'talk',lv:[3,4],k:'say',scene:'💬 🙂',story:'Dar una opinión distinta sin pelear se practica. Elige una frase, dila (o muéstrala) y marca cuando lo hiciste.',q:'Opinar distinto',phrases:['Entiendo tu idea. Yo lo veo distinto porque…','Puede que tengas razón en eso. Y yo pienso que…','Podemos estar en desacuerdo y seguir siendo amigos.']},
{id:'d12',t:'digi',lv:[3,4],who:'alone',k:'choice',scene:'📲 💸 ❓',story:'Un perfil que no conoces te ofrece un trabajo fácil desde el celular que paga mucho dinero.',q:'¿Qué haces?',o:['Desconfío, no doy datos ni dinero y consulto con un adulto','Le doy mis datos para empezar rápido','Invito a mis amigos sin averiguar'],ok:0,hint:'Si es demasiado bueno para ser verdad, probablemente lo es.',why:'Las ofertas muy fáciles y con mucho dinero suelen ser estafas. Nunca entregues datos bancarios ni claves y consúltalo con un adulto antes.'},
{id:'d13',t:'digi',lv:[3,4],who:'alone',k:'choice',scene:'📱 🕕 😴',story:'Llevas seis horas seguidas en el celular y te sientes cansado e irritable.',q:'¿Qué plan te ayuda más?',o:['Poner pausas con alarma y dejar el celular fuera de la cama una hora antes de dormir','Seguir hasta que me canse','Esconder el celular de mis papás'],ok:0,hint:'Tú puedes organizar tu tiempo.',why:'Las pausas y dormir sin pantallas ayudan al cuerpo y al ánimo. Decidir tus propios límites es una forma de autonomía.'},
{id:'d15',t:'digi',lv:[3,4],who:'alone',k:'choice',scene:'📸 🚫 📩',story:'Te llega una foto íntima de otra persona de tu edad, enviada sin su permiso.',q:'¿Qué haces?',o:['No la reenvío, la borro y aviso a un adulto de confianza','La reenvío al grupo','La guardo para después'],ok:0,hint:'Compartir esa imagen puede hacer mucho daño y tener consecuencias legales.',why:'Reenviar una imagen íntima sin permiso daña a la persona y puede ser delito. No la compartas, bórrala y avisa a un adulto: así proteges a la otra persona y a ti.'},
{id:'f9',t:'team',lv:[3,4],who:'together',k:'together',scene:'📅 📚 🤝',story:'Un plan de estudio acordado da autonomía y reduce las peleas.',q:'Plan de estudio acordado',tasks:['El adolescente propone cómo organizará la semana de estudio.','El adulto pregunta qué apoyo necesita, sin corregir.','Acuerdan una revisión de 10 minutos al final de la semana.','Definen qué pasa si el plan no funciona: se ajusta, no se castiga.'],adult:'Evite tomar el control del plan. Pregunte: “¿Qué necesitas de mí?”. La confianza crece cuando la persona cumple lo que propuso.'},
{id:'m18',t:'mind',lv:[2,3,4],k:'steps',scene:'🕵️ 😒 🌧️',story:'La ironía se aprende con un método de pistas. Sigue los pasos con calma.',q:'Método para reconocer la ironía',steps:['Paso 1. Escucha lo que dice la persona.','Paso 2. Mira su cara y escucha cómo lo dice (el tono de voz).','Paso 3. Mira lo que pasó antes.','Paso 4. Pregúntate: ¿las palabras coinciden con la cara y con lo que pasó?','Paso 5. Si NO coinciden, puede ser ironía: dice lo contrario de lo que siente.','Paso 6. Si dudas, pregunta con calma: “¿Lo dices en serio?”.']},
{id:'m19',t:'mind',lv:[1,2],k:'steps',scene:'☁️ 🙋',story:'A veces usamos frases que no significan lo que dicen. Por ejemplo, “estoy en las nubes” quiere decir “estoy distraído”.',q:'Frases con otro significado',steps:['Paso 1. Si una frase suena rara o imposible, puede ser una expresión.','Paso 2. Piensa en la situación: ¿qué podría querer decir?','Paso 3. Si no sabes, pregunta: “¿Qué quieres decir con eso?”.','Preguntar es una buena idea. No es de tontos.']},
/* ---- Vida adulta (nivel 5: 15 a 18 años) ---- */
/* Autonomía y decisiones */
{id:'v1',t:'vida',lv:[4],who:'alone',k:'choice',scene:'🎓 ❓ 🧭',story:'Tus papás te preguntan qué quieres hacer al salir del colegio. Todavía no lo sabes.',q:'¿Qué haces?',o:['Digo que aún no lo sé y propongo pasos: explorar opciones, probar cosas y hablar con un orientador','Elijo lo primero que se me ocurre para que dejen de preguntar','Digo que no me importa'],ok:0,hint:'No saber todavía es normal. Lo importante es buscar información.',why:'Es normal no tener claro el futuro a esta edad. Explorar, probar y pedir orientación te da información para decidir. Puedes ir paso a paso.'},
{id:'v2',t:'vida',lv:[4],who:'alone',k:'choice',scene:'🚌 🗺️ 📱',story:'Quieres empezar a ir solo a un lugar nuevo en transporte público.',q:'¿Cuál es un buen plan?',o:['Practicar el trayecto acompañado primero, llevar el celular cargado y avisar cuando llegue','Ir sin avisar a nadie para demostrar que puedo','No ir nunca por miedo a perderme'],ok:0,hint:'La autonomía se construye de a poco.',why:'La autonomía se practica por etapas: primero con apoyo, después con menos. Avisar y llevar el celular cargado cuida tu seguridad y hace que confíen más en ti.'},
{id:'v3',t:'vida',lv:[4],k:'order',scene:'🧭 ⚖️',story:'Para decisiones importantes sirve tener pasos. Toca los pasos en orden.',q:'Cómo tomar una decisión importante',steps:['Defino qué tengo que decidir','Reúno información','Pienso ventajas y desventajas','Pido la opinión de alguien de confianza','Decido y pruebo','Reviso cómo me fue'],why:'Decidir con pasos baja la ansiedad. Pedir opinión ayuda, pero la decisión es tuya. Revisar después te enseña para la próxima vez.'},
{id:'v4',t:'vida',lv:[4],k:'choice',open:true,scene:'🧭 🙋',story:'La autonomía no es todo o nada: se puede crecer en cada área. Elige las áreas en las que quieres más autonomía. Puedes elegir varias.',q:'¿Dónde quieres más autonomía?',o:['Mi dinero','Mis estudios o mi trabajo','Mi salud','Mis amistades y relaciones','Moverme por la ciudad','Mi casa y mis comidas'],why:'Gracias por contarlo. Esta información es valiosa para tu plan de vida. Puedes conversarla con tu familia y con tu equipo de apoyo.'},
{id:'v5',t:'vida',lv:[4],who:'together',k:'together',scene:'🌟 📝 🤝',story:'Un plan de vida parte de lo que la persona quiere, sus fortalezas y los apoyos que necesita.',q:'Mi plan de vida',tasks:['La persona dice 3 de sus fortalezas y el adulto agrega 2 que ha visto.','La persona cuenta 3 cosas que quiere lograr en el próximo año.','Eligen un primer paso pequeño y definen quién ayuda y cómo.','Acuerdan revisarlo en un mes.'],adult:'Pregunte siempre “¿qué quieres tú?” antes de proponer. Apoye a decidir en vez de decidir por la persona, y acompañe sin hablar en su lugar.'},
/* Dinero */
{id:'v6',t:'vida',lv:[4],who:'alone',k:'choice',scene:'💵 🧾 🐷',story:'Recibes $50.000 por un trabajo de verano y tienes gastos: transporte, colación y algo que quieres comprar.',q:'¿Cómo lo organizas?',o:['Separo primero lo necesario, luego lo que quiero y guardo una parte','Lo gasto todo en lo que quiero hoy','Se lo presto a quien me lo pida'],ok:0,hint:'Primero lo necesario.',why:'Un presupuesto simple separa lo necesario, lo que quieres y lo que guardas. Así el dinero alcanza y puedes cumplir metas.'},
{id:'v7',t:'vida',lv:[4],k:'order',scene:'🛒 💰',story:'Para comprar algo caro hay pasos. Toca los pasos en orden.',q:'Comprar algo que cuesta caro',steps:['Decido qué quiero y por qué','Averiguo precios en varios lugares','Calculo cuánto debo ahorrar y en cuánto tiempo','Ahorro un poco cada semana','Compro y reviso que esté bien'],why:'Ahorrar con un plan hace más fácil esperar. Comparar precios te ayuda a no pagar de más.'},
{id:'v8',t:'vida',lv:[4],who:'alone',k:'choice',scene:'🤝 💸 ❓',story:'Un amigo te pide dinero prestado, y las últimas veces no te devolvió.',q:'¿Qué haces?',o:['Digo con calma que no puedo prestar hasta que me devuelva lo anterior','Le presto de nuevo para no pelear','Dejo de hablarle sin decir por qué'],ok:0,hint:'Puedes cuidar el dinero y la amistad.',why:'Poner límites con el dinero cuida tu bolsillo y la amistad. Decirlo con calma y claro evita malos entendidos.'},
{id:'v9',t:'vida',lv:[4],who:'alone',k:'choice',scene:'📩 🏆 🔗 ⚠️',story:'Te llega un mensaje: “¡Ganaste un premio! Entra al link e ingresa tu clave bancaria”.',q:'¿Qué haces?',o:['No entro al link, no doy claves y aviso a un adulto o a mi banco','Entro rápido para no perder el premio','Reenvío el mensaje a mis amigos'],ok:0,hint:'Nadie serio pide tu clave por mensaje.',why:'Ningún banco ni empresa seria pide tus claves por mensaje. Es una estafa. No entres al link, no compartas claves y avisa a un adulto o a tu banco.'},
{id:'v10',t:'vida',lv:[4],who:'alone',k:'choice',scene:'🏷️ 💳 ⏳',story:'Ves una oferta de “compra ahora, paga después” de algo que no necesitas.',q:'¿Qué haces?',o:['Espero un día, reviso si lo necesito y cuánto pagaré en total','Lo compro porque la oferta termina hoy','Lo compro y pienso después cómo pagarlo'],ok:0,hint:'La urgencia es una forma de presionar.',why:'La urgencia (“solo hoy”) suele servir para que compres sin pensar. Esperar un día y revisar el costo total evita deudas.'},
{id:'v11',t:'vida',lv:[4],k:'choice',scene:'💳 🔐 🤫',story:'Tienes una tarjeta o cuenta con clave.',q:'¿Quién puede saber tu clave?',o:['Solo yo; y si necesito ayuda, un adulto de mucha confianza','Mi amigo, si me cae bien','Quien me la pida por chat'],ok:0,hint:'Una clave es como la llave de tu casa.',why:'La clave es personal. Solo se comparte con alguien de mucha confianza cuando necesitas ayuda, y se cambia después. Nunca se da por chat ni a desconocidos.'},
/* Trámites y vida cotidiana */
{id:'v12',t:'vida',lv:[4],k:'order',scene:'🏥 🪪 📅',story:'Pedir y usar una hora de salud tiene pasos. Toca los pasos en orden.',q:'Pedir una hora de salud',steps:['Averiguo cómo pedir hora (presencial, teléfono o aplicación)','Anoto la fecha y la hora','Explico con claridad qué me pasa','Llevo mi cédula','Llego a tiempo y llevo mis preguntas'],why:'Prepararse hace que la visita sirva más. Anotar tus preguntas antes ayuda a no olvidarlas cuando estás nervioso.'},
{id:'v13',t:'vida',lv:[4],who:'alone',k:'choice',scene:'📄 ❓ 🏢',story:'Tienes que hacer un trámite y no entiendes un papel que te piden.',q:'¿Qué haces?',o:['Pido que me lo expliquen paso a paso y lo anoto','Firmo sin entender para terminar rápido','Me voy sin hacer el trámite'],ok:0,hint:'Pedir una explicación es válido.',why:'Tienes derecho a entender lo que firmas. Pedir que te expliquen paso a paso y anotarlo es una forma segura de hacer trámites.'},
{id:'v14',t:'vida',lv:[4],k:'steps',scene:'🚪 🔑 📱',story:'Una lista fija antes de salir ayuda a no olvidar nada.',q:'Lista para salir de casa',steps:['Llaves.','Celular cargado.','Cédula.','Dinero o tarjeta.','Agua y comida si hace falta.','Aviso a alguien a dónde voy y a qué hora vuelvo.']},
{id:'v15',t:'vida',lv:[4],who:'alone',k:'choice',scene:'🗺️ 😰 🏙️',story:'Te pierdes volviendo a casa en un lugar que no conoces.',q:'¿Qué haces primero?',o:['Me detengo en un lugar seguro, respiro y reviso el mapa o llamo a alguien de confianza','Camino rápido sin rumbo','Le pido ayuda a la primera persona que me ofrece llevarme'],ok:0,hint:'Primero calma el cuerpo, luego busca el camino.',why:'Detenerte y respirar te ayuda a pensar. Usa el mapa o llama a alguien de confianza. No te vayas con desconocidos.'},
{id:'v16',t:'vida',lv:[4],k:'choice',scene:'🍳 🔥 ⚠️',story:'Estás cocinando y se prende fuego el aceite de la sartén.',q:'¿Qué haces?',o:['Apago el fuego y tapo la sartén con una tapa; si crece, salgo y llamo al 132','Le echo agua para apagarlo','Dejo la cocina y me voy a mi pieza'],ok:0,hint:'El agua no apaga el fuego del aceite.',why:'El aceite en llamas se apaga cortando el calor y tapando, nunca con agua. Si el fuego crece, sal de la casa y llama a Bomberos al 132.'},
{id:'v17',t:'vida',lv:[4],k:'choice',scene:'😵 🚑 📞',story:'Una persona se desmaya delante de ti y no responde.',q:'¿Qué haces?',o:['Llamo al 131, me quedo con ella y sigo las indicaciones','Le echo agua y espero que despierte','Me voy para no meterme en problemas'],ok:0,hint:'Pedir ayuda rápido es lo más importante.',why:'Llamar al 131 y quedarte con la persona salva vidas. La persona que atiende te dirá qué hacer paso a paso.'},
/* Estudios y trabajo */
{id:'v18',t:'vida',lv:[4],who:'alone',k:'choice',scene:'💼 🗣️ ❓',story:'En una entrevista de trabajo te hacen una pregunta que no sabes responder.',q:'¿Qué dices?',o:['“No lo sé todavía, pero puedo aprenderlo”','Invento una respuesta','Me quedo en silencio y me pongo a llorar'],ok:0,hint:'La honestidad con ganas de aprender suma.',why:'Ser honesto y mostrar disposición a aprender suele caer mejor que inventar. Respirar un momento antes de responder también ayuda.'},

let AC=null;
function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(kind){
  if(!P||!P.set.sound)return;
  try{const c=ac();const seq={ok:[523,659,784],try:[330,294],chest:[392,494,587,784],lvl:[523,659,784,1047]}[kind]||[440];let t=c.currentTime;
    seq.forEach(f=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.24);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.26);t+=.11;});}catch(e){}
}
function glide(f1,f2,dur){
  if(!P||!P.set.sound)return;
  try{const c=ac();const now=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f1,now);o.frequency.linearRampToValueAtTime(f2,now+dur);
    g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.04,now+.4);g.gain.linearRampToValueAtTime(0,now+dur);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+dur+.05);}catch(e){}
}
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices();}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
const FEM_RE=/female|mujer|sabina|helena|laura|paulina|monica|mónica|elena|elvira|dalia|paola|salome|salomé|camila|catalina|lupe|marisol|sofia|sofía|valentina|google español/i;
const MALE_RE=/\bmale\b|\bhombre\b|jorge|diego|pablo|raul|raúl|alvaro|álvaro|juan|carlos|tomas|tomás|enrique|antonio|andres|andrés|miguel/i;
const isMale=v=>MALE_RE.test(v.name);
const isFem=v=>FEM_RE.test(v.name)&&!isMale(v);
function pickVoice(){
  if(P&&P.set.voice){const sv=voices.find(x=>x.name===P.set.voice);if(sv)return sv;}
  const es=voices.filter(v=>/^es/i.test(v.lang));
  let vt=P&&P.set.vtype||'auto';
  if(vt==='auto'&&P&&P.set.avatarVoice!==false&&VOICES[P.theme])vt=VOICES[P.theme].g==='m'?'man':'girl';
  const fem=vt==='man'?es.filter(isMale):es.filter(isFem);
  if(fem.length){
    for(const pref of ['es-CL','es-419','es-MX','es-US','es-AR','es-ES']){const v=fem.find(x=>x.lang.replace('_','-').toLowerCase()===pref.toLowerCase());if(v)return v;}
    return fem[0];
  }
  for(const pref of ['es-CL','es-419','es-MX','es-US','es-AR','es-ES']){const v=es.find(x=>x.lang.replace('_','-').toLowerCase()===pref.toLowerCase());if(v)return v;}
  return es[0]||null;
}
function clean(t){return t.replace(/[\p{Extended_Pictographic}‍️]/gu,' ').replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();}
function speak(text,slow){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean(text));const v=pickVoice();
    if(v){u.voice=v;u.lang=v.lang;}else u.lang='es-CL';
    const sq=!P||P.set.squirrel!==false;
    const ti=(P&&P.set.tone!=null)?P.set.tone:7;
    const av=(P&&P.set.avatarVoice!==false)?VOICES[P.theme]:null;
    const sf=((P&&P.set.slow)||slow)?.85:1;
    if(av){u.pitch=av.pitch;u.rate=sf*av.rate;}
    else{u.pitch=sq?TONES[ti]:1.05;u.rate=sf*(sq?1+ti/7*.12:.93);}
    curU=u;u.onend=u.onerror=()=>{if(curU===u)duckMusic(false);};
    duckMusic(true);speechSynthesis.speak(u);}catch(e){}
}
function stopSpeak(){curU=null;try{speechSynthesis.cancel();}catch(e){}duckMusic(false);}

function semis(th,deg){const L=th.scale.length;return th.scale[deg%L]+12*Math.floor(deg/L);}
function noteAt(c,bus,t,freq,dur,type,gain,att){
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;
  const a=att||.012;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(dur,a+.05));
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+Math.max(dur,a+.05)+.05);
}

function kOrder(ctx){

<script>
(function(){
